services:
  app:
    image: ghcr.io/primelogicsol/sufipulse-sufitube:latest
    container_name: sufipulse-app
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - sufipulse-data:/app/.data
      - sufipulse-backups:/app/.data/backups
      - sufipulse-audit:/app/.data/audit
    env_file:
      - .env

volumes:
  sufipulse-data:
    driver: local
  sufipulse-backups:
    driver: local
  sufipulse-audit:
    driver: local
