name: sufipulse_new

services:
  app:
    image: ${SUFIPULSE_IMAGE:-ghcr.io/primelogicsol/sufipulse-sufitube:latest}
    container_name: sufipulse-new-app
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - app-data:/app/.data
      - app-backups:/app/.data/backups
      - app-audit:/app/.data/audit
    env_file:
      - .env

volumes:
  app-data:
    name: sufipulse_new_data
    driver: local
  app-backups:
    name: sufipulse_new_backups
    driver: local
  app-audit:
    name: sufipulse_new_audit
    driver: local
