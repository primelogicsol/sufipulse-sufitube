name: sufipulse_new

services:
  app:
    image: ${SUFIPULSE_IMAGE:-ghcr.io/primelogicsol/sufipulse-sufitube:latest}
    container_name: sufipulse-new-app
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - app-data:/app/.data
      - app-backups:/app/.data/backups
      - app-audit:/app/.data/audit
    env_file:
      - .env
    environment:
      # ── Ionos SMTP (password read from .env via env_file above) ──
      EMAIL_PROVIDER: "smtp"
      SMTP_HOST: "smtp.ionos.com"
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: "contact@sufipulse.com"
      EMAIL_FROM: "contact@sufipulse.com"
      EMAIL_FROM_NAME: "SufiPulse"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  app-data:
    name: sufipulse_new_data
    driver: local
  app-backups:
    name: sufipulse_new_backups
    driver: local
  app-audit:
    name: sufipulse_new_audit
    driver: local
