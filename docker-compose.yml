version: '3.8'

services:
  sufipulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sufipulse-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - sufipulse-data:/app/.data
      - sufipulse-backups:/app/.data/backups
      - sufipulse-audit:/app/.data/audit
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env.local
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

volumes:
  sufipulse-data:
    driver: local
  sufipulse-backups:
    driver: local
  sufipulse-audit:
    driver: local
