name: Private Audio Runtime Bootstrap

on:
  push:
    branches:
      - feature/private-audio-alignment-integration
    paths:
      - '.github/workflows/private-audio-runtime-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PA_PROVIDER_KEY: ${{ secrets.PRIVATE_AUDIO_PROVIDER_KEY }}
      PA_ALIGNMENT_URL: ${{ secrets.PRIVATE_AUDIO_ALIGNMENT_URL_TEMPLATE }}
      PA_ALIGNMENT_AUTH: ${{ secrets.PRIVATE_AUDIO_ALIGNMENT_AUTHORIZATION }}
      PA_ALIGNMENT_HEADERS: ${{ secrets.PRIVATE_AUDIO_ALIGNMENT_EXTRA_HEADERS_JSON }}
      PA_STREAM_URL: ${{ secrets.PRIVATE_AUDIO_STREAM_URL_TEMPLATE }}
      PA_STREAM_AUTH: ${{ secrets.PRIVATE_AUDIO_STREAM_AUTHORIZATION }}
      PA_STREAM_HEADERS: ${{ secrets.PRIVATE_AUDIO_STREAM_EXTRA_HEADERS_JSON }}
    steps:
      - name: Report repository-secret presence without values
        shell: bash
        run: |
          set -euo pipefail
          for k in PA_PROVIDER_KEY PA_ALIGNMENT_URL PA_ALIGNMENT_AUTH PA_ALIGNMENT_HEADERS PA_STREAM_URL PA_STREAM_AUTH PA_STREAM_HEADERS; do
            if [ -n "${!k:-}" ]; then echo "$k=PRESENT"; else echo "$k=ABSENT"; fi
          done

      - name: Inject any configured private-audio secrets into VPS env
        uses: appleboy/ssh-action@v1.2.2
        env:
          PA_PROVIDER_KEY: ${{ env.PA_PROVIDER_KEY }}
          PA_ALIGNMENT_URL: ${{ env.PA_ALIGNMENT_URL }}
          PA_ALIGNMENT_AUTH: ${{ env.PA_ALIGNMENT_AUTH }}
          PA_ALIGNMENT_HEADERS: ${{ env.PA_ALIGNMENT_HEADERS }}
          PA_STREAM_URL: ${{ env.PA_STREAM_URL }}
          PA_STREAM_AUTH: ${{ env.PA_STREAM_AUTH }}
          PA_STREAM_HEADERS: ${{ env.PA_STREAM_HEADERS }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: PA_PROVIDER_KEY,PA_ALIGNMENT_URL,PA_ALIGNMENT_AUTH,PA_ALIGNMENT_HEADERS,PA_STREAM_URL,PA_STREAM_AUTH,PA_STREAM_HEADERS
          script: |
            set -euo pipefail
            cd /var/www/sufipulse-new
            test -f .env
            chmod 600 .env

            python3 - <<'PY'
            import os
            from pathlib import Path

            path = Path('/var/www/sufipulse-new/.env')
            raw = path.read_text()
            mapping = {
                'PRIVATE_AUDIO_PROVIDER_KEY': os.environ.get('PA_PROVIDER_KEY', ''),
                'PRIVATE_AUDIO_ALIGNMENT_URL_TEMPLATE': os.environ.get('PA_ALIGNMENT_URL', ''),
                'PRIVATE_AUDIO_ALIGNMENT_AUTHORIZATION': os.environ.get('PA_ALIGNMENT_AUTH', ''),
                'PRIVATE_AUDIO_ALIGNMENT_EXTRA_HEADERS_JSON': os.environ.get('PA_ALIGNMENT_HEADERS', ''),
                'PRIVATE_AUDIO_STREAM_URL_TEMPLATE': os.environ.get('PA_STREAM_URL', ''),
                'PRIVATE_AUDIO_STREAM_AUTHORIZATION': os.environ.get('PA_STREAM_AUTH', ''),
                'PRIVATE_AUDIO_STREAM_EXTRA_HEADERS_JSON': os.environ.get('PA_STREAM_HEADERS', ''),
            }
            lines = raw.splitlines()
            changed = []
            for key, value in mapping.items():
                if not value:
                    continue
                lines = [line for line in lines if not line.startswith(key + '=')]
                lines.append(f'{key}={value}')
                changed.append(key)
            path.write_text('\n'.join(lines) + '\n')
            os.chmod(path, 0o600)
            print('VPS_ENV_UPDATED=' + (','.join(changed) if changed else 'NONE'))
            PY

            echo 'VPS_PRIVATE_AUDIO_PRESENCE:'
            for key in \
              PRIVATE_AUDIO_PROVIDER_KEY \
              PRIVATE_AUDIO_ALIGNMENT_URL_TEMPLATE \
              PRIVATE_AUDIO_ALIGNMENT_AUTHORIZATION \
              PRIVATE_AUDIO_ALIGNMENT_EXTRA_HEADERS_JSON \
              PRIVATE_AUDIO_STREAM_URL_TEMPLATE \
              PRIVATE_AUDIO_STREAM_AUTHORIZATION \
              PRIVATE_AUDIO_STREAM_EXTRA_HEADERS_JSON; do
              if grep -q "^${key}=" .env; then echo "${key}=PRESENT"; else echo "${key}=ABSENT"; fi
            done
