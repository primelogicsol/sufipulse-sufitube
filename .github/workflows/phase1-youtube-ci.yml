name: Phase 1 YouTube Foundation CI

on:
  push:
    branches:
      - work/youtube-phase1-foundation
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare standalone data fixtures
        run: |
          mkdir -p .data
          echo "{}" > .data/registries.json
          echo "{}" > .data/brand-registry.json
          echo "{}" > .data/crawler-registry.json
          echo "{}" > .data/discovery-analytics.json
          for f in constitutional_core unified_knowledge cms-releases articles atlas_entities atlas_relationships knowledge audit payout-accounts subscribers adoptions users; do echo "[]" > .data/$f.json; done

      - name: Type check
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: npm run type-check

      - name: Lint
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: npm run lint

      - name: Production build
        env:
          CI: 'true'
          SKIP_ENV_VALIDATION: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          NODE_ENV: production
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_APP_URL: 'https://sufipulse.com'
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_YOUTUBE_CHANNEL_ID: 'UCraDr3i5A3k0j7typ6tOOsQ'
          NEXT_PUBLIC_ENABLE_USER_GOOGLE_ADS: 'false'
        run: npm run build
