name: Phase 1 YouTube Foundation CI

on:
  push:
    branches:
      - work/youtube-phase1-foundation
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare standalone data fixtures
        run: |
          mkdir -p .data
          echo "{}" > .data/registries.json
          echo "{}" > .data/brand-registry.json
          echo "[]" > .data/crawler-registry.json
          echo "[]" > .data/discovery-analytics.json
          for f in constitutional_core unified_knowledge cms-releases articles atlas_entities atlas_relationships knowledge audit payout-accounts subscribers adoptions users; do echo "[]" > .data/$f.json; done

      - name: Phase 1 YouTube integrity guard
        run: node scripts/phase1-youtube-integrity-guard.mjs

      - name: Phase 1 UI provenance guard
        id: provenance
        run: node scripts/phase1-provenance-ui-guard.mjs

      - name: Phase 1 final code-review guard
        id: final_review
        run: node scripts/phase1-final-review-guard.mjs

      - name: Phase 1 runtime failure contracts
        id: failure_contracts
        run: node -r ./scripts/register-phase1-ts.cjs ./scripts/phase1-youtube-runtime-tests.ts

      - name: Type check (capture repository baseline)
        id: typecheck
        continue-on-error: true
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: |
          set -o pipefail
          npm run type-check 2>&1 | tee /tmp/phase1-typecheck.log

      - name: Differential TypeScript gate
        id: typescript_diff
        run: |
          changed="$(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx')"
          echo "Phase 1 changed TypeScript files:"
          echo "$changed"
          failed=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if grep -Fq "$file(" /tmp/phase1-typecheck.log; then
              echo "Phase 1 TypeScript error detected in changed file: $file"
              grep -F "$file(" /tmp/phase1-typecheck.log || true
              failed=1
            fi
          done <<< "$changed"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "No TypeScript errors were reported in Phase 1 changed files."

      - name: Lint repository (runner validation)
        id: lint
        continue-on-error: true
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: npm run lint

      - name: Differential lint gate
        id: lint_diff
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: |
          mapfile -t changed < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' | grep -v '^\.github/' || true)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No lintable Phase 1 files changed."
            exit 0
          fi

          echo "Linting current Phase 1 files..."
          npx eslint "${changed[@]}" -f json > /tmp/phase1-head-lint.json || true

          rm -rf /tmp/phase1-base
          git worktree add --detach /tmp/phase1-base origin/main
          cp eslint.config.mjs /tmp/phase1-base/eslint.config.mjs
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/phase1-base/node_modules

          basefiles=()
          for file in "${changed[@]}"; do
            [ "$file" = "eslint.config.mjs" ] && continue
            if git cat-file -e "origin/main:$file" 2>/dev/null; then
              basefiles+=("$file")
            fi
          done

          if [ "${#basefiles[@]}" -gt 0 ]; then
            (
              cd /tmp/phase1-base
              "$GITHUB_WORKSPACE/node_modules/.bin/eslint" "${basefiles[@]}" -f json > /tmp/phase1-base-lint.json || true
            )
          else
            echo '[]' > /tmp/phase1-base-lint.json
          fi

          node scripts/phase1-lint-differential.mjs /tmp/phase1-base-lint.json /tmp/phase1-head-lint.json
          git worktree remove --force /tmp/phase1-base

      - name: Production build
        id: build
        env:
          CI: 'true'
          SKIP_ENV_VALIDATION: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          NODE_ENV: production
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_APP_URL: 'https://sufipulse.com'
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_YOUTUBE_CHANNEL_ID: 'UCraDr3i5A3k0j7typ6tOOsQ'
          NEXT_PUBLIC_ENABLE_USER_GOOGLE_ADS: 'false'
        run: npm run build

      - name: Built-route no-regression guard
        id: regression
        run: node scripts/phase1-built-route-regression-guard.mjs

      - name: Main-route parity guard
        id: route_parity
        run: node scripts/phase1-route-parity-guard.mjs

      - name: Live read-only YouTube Data API catalog audit
        id: live_catalog
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LEGACY_YOUTUBE_API_KEY: ${{ secrets.NEXT_PUBLIC_YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: 'UCraDr3i5A3k0j7typ6tOOsQ'
        run: node scripts/phase1-youtube-live-audit.mjs

      - name: Live channel to CMS reconciliation audit
        id: live_reconciliation
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: 'UCraDr3i5A3k0j7typ6tOOsQ'
          MIN_EXPECTED_UPLOADS: '95'
        run: node scripts/phase1-youtube-live-reconciliation.mjs

      - name: Live incremental and full CMS sync integration
        id: live_sync
        env:
          DATA_DIR: /tmp/sufipulse-phase1-live-sync-${{ github.run_id }}-${{ github.run_attempt }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: 'UCraDr3i5A3k0j7typ6tOOsQ'
          MIN_EXPECTED_UPLOADS: '95'
          INCREMENTAL_LOOKBACK_DAYS: '30'
        run: |
          rm -rf "$DATA_DIR"
          mkdir -p "$DATA_DIR"
          node -r ./scripts/register-phase1-ts.cjs ./scripts/phase1-youtube-live-sync-integration.ts
          rm -rf "$DATA_DIR"

      - name: Validation summary
        if: always()
        run: |
          echo "UI provenance guard:             ${{ steps.provenance.outcome }}"
          echo "Final code-review guard:         ${{ steps.final_review.outcome }}"
          echo "Runtime failure contracts:       ${{ steps.failure_contracts.outcome }}"
          echo "Repository type-check baseline:  ${{ steps.typecheck.outcome }}"
          echo "Differential TypeScript gate:    ${{ steps.typescript_diff.outcome }}"
          echo "Repository lint runner:          ${{ steps.lint.outcome }}"
          echo "Differential lint gate:          ${{ steps.lint_diff.outcome }}"
          echo "Production build:                ${{ steps.build.outcome }}"
          echo "Built-route regression guard:    ${{ steps.regression.outcome }}"
          echo "Main-route parity guard:         ${{ steps.route_parity.outcome }}"
          echo "Live catalog outcome:            ${{ steps.live_catalog.outcome }}"
          echo "Live catalog status:             ${{ steps.live_catalog.outputs.status }}"
          echo "Live catalog credential:         ${{ steps.live_catalog.outputs.credential_mode }}"
          echo "Live public uploads:             ${{ steps.live_catalog.outputs.count }}"
          echo "Reconciliation outcome:          ${{ steps.live_reconciliation.outcome }}"
          echo "Reconciliation status:           ${{ steps.live_reconciliation.outputs.status }}"
          echo "Reconciliation uploads:          ${{ steps.live_reconciliation.outputs.uploads }}"
          echo "CMS seed releases:               ${{ steps.live_reconciliation.outputs.cms_seed }}"
          echo "Matched:                         ${{ steps.live_reconciliation.outputs.matched }}"
          echo "YouTube only:                    ${{ steps.live_reconciliation.outputs.youtube_only }}"
          echo "Metadata mismatch:               ${{ steps.live_reconciliation.outputs.metadata_mismatch }}"
          echo "Duplicate YouTube IDs:           ${{ steps.live_reconciliation.outputs.duplicates }}"
          echo "CMS only / nonpublic:            ${{ steps.live_reconciliation.outputs.cms_only_or_nonpublic }}"
          echo "Missing YouTube ID:              ${{ steps.live_reconciliation.outputs.missing_youtube_id }}"
          echo "Live uploads in last 30 days:    ${{ steps.live_reconciliation.outputs.recent_30d }}"
          echo "Incremental create plan:         ${{ steps.live_reconciliation.outputs.recent_create }}"
          echo "Incremental update plan:         ${{ steps.live_reconciliation.outputs.recent_update }}"
          echo "Live CMS sync integration:       ${{ steps.live_sync.outcome }}"
          echo "Hard Phase 1 gates include integrity + UI provenance + final review + runtime contracts + differential TypeScript + differential lint + production build + critical-route regression + full main-route parity + live Data API audit + live CMS reconciliation + isolated live CMS sync integration."
          echo "The live Data API audit tries owner OAuth first, then a server-only API key, then the legacy key. Admin catalog sync itself uses the OAuth-first read-only client."