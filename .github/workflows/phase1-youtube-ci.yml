name: Phase 1 YouTube Foundation CI

on:
  push:
    branches:
      - work/youtube-phase1-foundation
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare standalone data fixtures
        run: |
          mkdir -p .data
          echo "{}" > .data/registries.json
          echo "{}" > .data/brand-registry.json
          echo "[]" > .data/crawler-registry.json
          echo "[]" > .data/discovery-analytics.json
          for f in constitutional_core unified_knowledge cms-releases articles atlas_entities atlas_relationships knowledge audit payout-accounts subscribers adoptions users; do echo "[]" > .data/$f.json; done

      - name: Phase 1 YouTube integrity guard
        run: node scripts/phase1-youtube-integrity-guard.mjs

      - name: Phase 1 runtime failure contracts
        run: node -r ./scripts/register-phase1-ts.cjs ./scripts/phase1-youtube-runtime-tests.ts

      - name: Type check (capture repository baseline)
        id: typecheck
        continue-on-error: true
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: |
          set -o pipefail
          npm run type-check 2>&1 | tee /tmp/phase1-typecheck.log

      - name: Differential TypeScript gate
        run: |
          changed="$(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx')"
          echo "Phase 1 changed TypeScript files:"
          echo "$changed"
          failed=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if grep -Fq "$file(" /tmp/phase1-typecheck.log; then
              echo "Phase 1 TypeScript error detected in changed file: $file"
              grep -F "$file(" /tmp/phase1-typecheck.log || true
              failed=1
            fi
          done <<< "$changed"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "No TypeScript errors were reported in Phase 1 changed files."

      - name: Lint repository (runner validation)
        id: lint
        continue-on-error: true
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: npm run lint

      - name: Differential lint gate
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: |
          mapfile -t changed < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' | grep -v '^\.github/' || true)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No lintable Phase 1 files changed."
            exit 0
          fi

          echo "Linting current Phase 1 files..."
          npx eslint "${changed[@]}" -f json > /tmp/phase1-head-lint.json || true

          rm -rf /tmp/phase1-base
          git worktree add --detach /tmp/phase1-base origin/main
          cp eslint.config.mjs /tmp/phase1-base/eslint.config.mjs
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/phase1-base/node_modules

          basefiles=()
          for file in "${changed[@]}"; do
            [ "$file" = "eslint.config.mjs" ] && continue
            if git cat-file -e "origin/main:$file" 2>/dev/null; then
              basefiles+=("$file")
            fi
          done

          if [ "${#basefiles[@]}" -gt 0 ]; then
            (
              cd /tmp/phase1-base
              "$GITHUB_WORKSPACE/node_modules/.bin/eslint" "${basefiles[@]}" -f json > /tmp/phase1-base-lint.json || true
            )
          else
            echo '[]' > /tmp/phase1-base-lint.json
          fi

          node scripts/phase1-lint-differential.mjs /tmp/phase1-base-lint.json /tmp/phase1-head-lint.json
          git worktree remove --force /tmp/phase1-base

      - name: Production build
        id: build
        env:
          CI: 'true'
          SKIP_ENV_VALIDATION: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          NODE_ENV: production
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_APP_URL: 'https://sufipulse.com'
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_YOUTUBE_CHANNEL_ID: 'UCraDr3i5A3k0j7typ6tOOsQ'
          NEXT_PUBLIC_ENABLE_USER_GOOGLE_ADS: 'false'
        run: npm run build

      - name: Live read-only YouTube Data API catalog audit
        id: live_catalog
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LEGACY_YOUTUBE_API_KEY: ${{ secrets.NEXT_PUBLIC_YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: 'UCraDr3i5A3k0j7typ6tOOsQ'
        run: node scripts/phase1-youtube-live-audit.mjs

      - name: Validation summary
        if: always()
        run: |
          echo "Repository type-check baseline: ${{ steps.typecheck.outcome }}"
          echo "Repository lint runner:         ${{ steps.lint.outcome }}"
          echo "Production build:              ${{ steps.build.outcome }}"
          echo "Live catalog outcome:          ${{ steps.live_catalog.outcome }}"
          echo "Live catalog status:           ${{ steps.live_catalog.outputs.status }}"
          echo "Live catalog credential:       ${{ steps.live_catalog.outputs.credential_mode }}"
          echo "Live public uploads:           ${{ steps.live_catalog.outputs.count }}"
          echo "Hard Phase 1 gates are integrity guard + runtime contracts + differential TypeScript + differential lint + production build."
          echo "The live Data API audit now tries owner OAuth first, then a server-only API key, then the legacy key."
