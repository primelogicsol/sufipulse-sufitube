name: Patch Release Runtime Media

on:
  push:
    branches:
      - feature/private-audio-alignment-integration
    paths:
      - '.github/workflows/patch-release-runtime-media.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/private-audio-alignment-integration
          fetch-depth: 0

      - name: Patch release detail media bridge
        run: python3 scripts/patch-release-runtime-media.py

      - name: Install dependencies
        run: npm install

      - name: Type-check private audio surface
        run: npx tsc --noEmit -p tsconfig.private-audio-ci.json --pretty false

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(public)/release-detail/[slug]/page.tsx'
          git diff --cached --check
          git commit -m "Wire release page to safe runtime audio stream"
          git push origin HEAD:feature/private-audio-alignment-integration
