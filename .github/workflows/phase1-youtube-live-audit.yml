name: Phase 1 YouTube Live Data API Audit

on:
  workflow_dispatch:
  push:
    branches:
      - work/youtube-phase1-foundation
    paths:
      - scripts/phase1-youtube-live-audit.mjs
      - .github/workflows/phase1-youtube-live-audit.yml
      - .github/workflows/phase1-youtube-ci.yml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify configured YouTube OAuth client identity
        env:
          CONFIGURED_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          EXPECTED_CLIENT_ID: '176632661339-vblolbmsu073vu0bimlprbc962cgdbh3.apps.googleusercontent.com'
        run: |
          node <<'NODE'
          function normalize(raw, keyName) {
            let value = String(raw || '').trim();
            if (keyName && value.startsWith(`${keyName}=`)) value = value.slice(keyName.length + 1).trim();
            if (
              value.length >= 2 &&
              ((value.startsWith('"') && value.endsWith('"')) ||
               (value.startsWith("'") && value.endsWith("'")))
            ) value = value.slice(1, -1).trim();
            return value;
          }
          const configured = normalize(process.env.CONFIGURED_CLIENT_ID, 'YOUTUBE_CLIENT_ID');
          const expected = normalize(process.env.EXPECTED_CLIENT_ID, 'EXPECTED_CLIENT_ID');
          if (!configured) {
            console.error('YOUTUBE_CLIENT_ID is not configured in GitHub Actions.');
            process.exit(1);
          }
          if (configured !== expected) {
            console.error('YOUTUBE_CLIENT_ID does not match the verified Sufipulse OAuth web client.');
            process.exit(1);
          }
          console.log('YOUTUBE_CLIENT_ID matches the verified Sufipulse OAuth web client.');
          NODE

      - name: Live read-only YouTube Data API catalog audit
        id: live_catalog
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LEGACY_YOUTUBE_API_KEY: ${{ secrets.NEXT_PUBLIC_YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: 'UCraDr3i5A3k0j7typ6tOOsQ'
        run: node scripts/phase1-youtube-live-audit.mjs

      - name: Audit summary
        if: always()
        run: |
          echo "Live catalog status:     ${{ steps.live_catalog.outputs.status }}"
          echo "Credential mode:         ${{ steps.live_catalog.outputs.credential_mode }}"
          echo "Verified public uploads: ${{ steps.live_catalog.outputs.count }}"
