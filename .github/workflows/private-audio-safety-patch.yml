name: Private Audio Multilingual Safety Patch

on:
  push:
    branches:
      - feature/private-audio-alignment-integration
    paths:
      - .github/workflows/private-audio-safety-patch.yml
      - scripts/patch-private-audio-multilingual-safety.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/private-audio-alignment-integration
          fetch-depth: 0

      - name: Apply multilingual safety patch
        run: python3 scripts/patch-private-audio-multilingual-safety.py

      - name: Install dependencies
        run: npm install

      - name: Validate private audio integration
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: npx tsc --noEmit -p tsconfig.private-audio-ci.json

      - name: Commit route patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- 'app/api/admin/releases/[id]/audio-alignment/route.ts'; then
            echo 'No route change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/api/admin/releases/[id]/audio-alignment/route.ts'
          git diff --cached --check
          git commit -m 'Protect translated captions during timing replacement'
          git push origin HEAD:feature/private-audio-alignment-integration
