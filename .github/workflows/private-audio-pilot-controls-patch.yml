name: Private Audio Pilot Controls Patch

on:
  push:
    branches:
      - feature/private-audio-alignment-integration
    paths:
      - '.github/workflows/private-audio-pilot-controls-patch.yml'
      - 'scripts/patch-private-audio-pilot-controls.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/private-audio-alignment-integration
          fetch-depth: 0

      - name: Apply pilot controls patch
        run: python3 scripts/patch-private-audio-pilot-controls.py

      - name: Install dependencies
        run: npm install

      - name: Validate private audio integration
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: npx tsc --noEmit -p tsconfig.private-audio-ci.json

      - name: Commit UI patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- 'app/admin/cms-releases/[id]/audio-alignment/page.tsx'; then
            echo 'No page change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/admin/cms-releases/[id]/audio-alignment/page.tsx'
          git diff --cached --check
          git commit -m 'Add private audio pilot probe and caption exports'
          git push origin HEAD:feature/private-audio-alignment-integration
