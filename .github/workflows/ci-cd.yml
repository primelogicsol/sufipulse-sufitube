name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Step 1: Lint and Type Check
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run linting
        run: npm run lint || echo "No lint script found, skipping"

  # Step 2: Build
  build:
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create env file
        run: |
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" > .env.local
          echo "DATABASE_URL=file:./.data/database.json" >> .env.local
          echo "JWT_SECRET=ci-test-secret-key" >> .env.local

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next

  # Step 3: Docker Build (only on main branch)
  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t sufipulse:${{ github.sha }} .

      - name: Test Docker image
        run: docker run --rm sufipulse:${{ github.sha }} node -e "console.log('Docker image OK')"

  # Step 4: Deploy (Manual trigger or main branch)
  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy notification
        run: |
          echo "🚀 Deployment ready for SufiPulse!"
          echo "Build SHA: ${{ github.sha }}"
          echo "To deploy to your VPS:"
          echo "1. SSH into your server"
          echo "2. Pull latest code: git pull origin main"
          echo "3. Install dependencies: npm ci"
          echo "4. Build: npm run build"
          echo "5. Start: pm2 start ecosystem.config.js"
          echo "   OR: docker-compose up -d"
