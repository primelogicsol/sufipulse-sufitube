name: Deploy to VPS

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push latest image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_YOUTUBE_API_KEY=${{ secrets.NEXT_PUBLIC_YOUTUBE_API_KEY }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          provenance: false

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            _s="init"
            trap 'echo "[DEPLOY FAILED] section=${_s} exit=$?" >&2' ERR

            # ── 1. working directory ─────────────────────────────────────────
            _s="cd"
            cd /var/www/sufipulse-new
            echo "[deploy] pwd=$(pwd)"

            # ── 2. docker compose available? ─────────────────────────────────
            _s="compose-check"
            if ! docker compose version 2>/dev/null; then
              echo "[deploy] FATAL: docker compose plugin not found" >&2
              echo "[deploy] Docker version: $(docker --version 2>&1)" >&2
              exit 1
            fi

            # ── 3. .env file ─────────────────────────────────────────────────
            _s="env-file"
            if [ ! -f .env ]; then
              if [ -f .env.local ]; then
                cp .env.local .env
                echo "[deploy] .env created from .env.local"
              else
                echo "[deploy] FATAL: neither .env nor .env.local found" >&2
                exit 1
              fi
            fi
            echo "[deploy] .env present: $(wc -l < .env) lines"

            # ── 4. inject secrets from CI ────────────────────────────────────
            _s="inject-secrets"
            _e() { k="$1"; v="$2"; [ -z "$v" ] && return; sed -i "/^${k}=/d" .env; echo "${k}=${v}" >> .env; }
            _e GOOGLE_ADS_CLIENT_ID         "${{ secrets.GOOGLE_ADS_CLIENT_ID }}"
            _e GOOGLE_ADS_CLIENT_SECRET     "${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}"
            _e GOOGLE_ADS_DEVELOPER_TOKEN   "${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}"
            _e GOOGLE_ADS_REDIRECT_URI      "${{ secrets.GOOGLE_ADS_REDIRECT_URI }}"
            _e GOOGLE_ADS_LOGIN_CUSTOMER_ID "${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}"
            _e GOOGLE_ADS_CREATE_MODE       "manual_review"
            echo "[deploy] .env after injection: $(wc -l < .env) lines"

            # ── 5. GHCR auth ─────────────────────────────────────────────────
            _s="docker-login"
            docker logout ghcr.io 2>/dev/null || true
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # ── 6. pull latest image ─────────────────────────────────────────
            _s="docker-pull"
            docker compose pull app

            # ── 7. recreate container ────────────────────────────────────────
            _s="docker-up"
            docker compose up -d --force-recreate app

            # ── 8. cleanup & verify ──────────────────────────────────────────
            _s="cleanup"
            docker image prune -f

            _s="verify"
            docker ps
            curl -I http://127.0.0.1:3001 || true
            echo "[deploy] DONE"
