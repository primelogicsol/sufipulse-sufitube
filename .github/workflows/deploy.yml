name: SufiPulse CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false
        default: "Manual trigger"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: primelogicsol/sufipulse

jobs:
  # ── Job 1: Type check + build ───────────────────────────
  ci:
    name: Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long
          JWT_REFRESH_SECRET: ci-refresh-secret-must-be-at-least-32-chars
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  # ── Job 2: Build Docker image and push to GHCR ─────────
  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    outputs:
      image_digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}/api
            NEXT_PUBLIC_YOUTUBE_API_KEY=${{ secrets.NEXT_PUBLIC_YOUTUBE_API_KEY }}
            NEXT_PUBLIC_YOUTUBE_CHANNEL_ID=${{ secrets.NEXT_PUBLIC_YOUTUBE_CHANNEL_ID }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:cache,mode=max

  # ── Job 3: Deploy to IONOS VPS ─────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-image

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/var/www/sufipulse-new"

      - name: Pull image and restart container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd /var/www/sufipulse-new

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export SUFIPULSE_IMAGE=ghcr.io/${{ env.IMAGE_NAME }}:latest
            docker compose pull app
            docker compose up -d --force-recreate app
            docker image prune -f

            echo "Waiting 30s for container to initialise..."
            sleep 30

            if docker ps --filter "name=sufipulse-app" --filter "status=running" | grep -q sufipulse-app; then
              echo "Container is running."
            else
              echo "ERROR: Container is not running. Logs:"
              docker compose logs app --tail=50
              exit 1
            fi

            echo ""
            echo "=== Container status ==="
            docker compose ps

            echo ""
            echo "=== Last 30 log lines ==="
            docker compose logs app --tail=30

  # ── Job 4: Smoke test ──────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true

    steps:
      - name: Poll health endpoint (up to 3 minutes)
        run: |
          URL="https://test.sufipulse.com/api/health"
          echo "Polling $URL ..."
          for i in $(seq 1 36); do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 15 "$URL" || echo "000")
            echo "Attempt $i/36 — HTTP $STATUS"
            if [[ "$STATUS" == "200" ]]; then
              echo "Smoke test passed."
              exit 0
            fi
            sleep 5
          done
          echo "WARNING: $URL did not return 200 within 3 minutes."
          echo "Deployment succeeded — check reverse proxy / DNS if site is unreachable."
          exit 0
