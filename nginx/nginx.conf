server {
    listen 80;
    server_name _;   # replace with your domain when ready, e.g. sufipulse.com www.sufipulse.com

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                      always;
    add_header X-XSS-Protection      "1; mode=block"                 always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # Allow large uploads for video conversion (up to 500 MB)
    client_max_body_size 500M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml font/woff2;
    gzip_min_length 1000;
    gzip_vary on;

    # Next.js static assets — immutable 1-year cache
    location /_next/static/ {
        proxy_pass http://app:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public folder — 30-day cache
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|otf)$ {
        proxy_pass http://app:3000;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Video converter — extended timeout for FFmpeg (up to 10 min for large files)
    location /api/video/convert {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }

    # All other requests → Next.js server
    location / {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── HTTPS (uncomment after adding SSL certs) ─────────
    # To get free SSL: run  certbot --nginx -d sufipulse.com
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
}
